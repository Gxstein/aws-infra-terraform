name: app

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for the repository integration tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tasks
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d tasks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_NAME: tasks
      DB_USER: app
      DB_PASSWORD: app
      DB_SSLMODE: disable
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -v

  build-and-deploy:
    name: build, push to ECR and deploy
    needs: test
    # Only on main, and only after the AWS side is configured (see README > CI/CD)
    if: github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.ref }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: app
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy on EC2 with SSM Run Command
        run: |
          TAG="${GITHUB_SHA::7}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${TAG}" \
            --parameters "commands=['/usr/local/bin/deploy-app.sh ${TAG}']" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"

          # Waits up to 5 minutes; fails the job if the script fails on the instance
          for _ in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
            esac
          done
          [ "$STATUS" = "Success" ] || { echo "Deploy timed out"; exit 1; }
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

      - name: Smoke test
        run: |
          HOST=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicDnsName" --output text)
          for _ in $(seq 1 12); do
            if curl -fsS "http://$HOST/health"; then exit 0; fi
            sleep 5
          done
          echo "API did not become healthy" && exit 1
